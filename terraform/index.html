<!DOCTYPE html>
<html>
<head>
  <title>Rock Paper Scissors</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; background-color: #FFFDD0; }
    button { font-size: 20px; margin: 10px; padding: 10px 20px; }
    h2 { color: #444; }
  </style>
</head>
<body>
  <h1>Rock Paper Scissors</h1>
  <button onclick="play('rock')">Rock</button>
  <button onclick="play('paper')">Paper</button>
  <button onclick="play('scissors')">Scissors</button>
  <h2 id="result"></h2>


  <script>
    function play(user) {
      const choices = ["rock", "paper", "scissors"];
      const computer = choices[Math.floor(Math.random() * 3)];
      let result = "";

      if (user === computer) result = "It's a tie!";
      else if (
        (user === "rock" && computer === "scissors") ||
        (user === "paper" && computer === "rock") ||
        (user === "scissors" && computer === "paper")
      ) result = `You win! Computer chose ${computer}`;
      else result = `You lose! Computer chose ${computer}`;

      document.getElementById("result").innerText = result;
    }
  </script>
</body>
</html>
